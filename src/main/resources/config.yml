# MultiverseCreatures Configuration

### General Settings
general:
  debug: false
  locale: "en"

### Wandering Trader (Multiverse Merchant)
merchant:
  enabled: true
  spawn-chance: 0.3
  custom-name: "&6Multiverse Merchant"
  name-visible: true
  trades:
    scooby-cookies:
      enabled: true
      price:
        material: "DIAMOND"
        amount: 20
      result-amount: 5
      max-uses: 999
    excalibur:
      enabled: true
      price:
        - material: "NETHER_STAR"
          amount: 16
          custom-item: "starcore"
        - material: "NETHERITE_INGOT"
          amount: 32
      max-uses: 1
    ice-crown:
      enabled: true
      price:
        - material: "NETHER_STAR"
          amount: 48
        - material: "BLUE_ICE"
          amount: 64
      max-uses: 1
    wirts-lantern:
      enabled: true
      price:
        - material: "SOUL_SAND"
          amount: 32
        - material: "SOUL_SOIL"
          amount: 16
      max-uses: 1

### Scooby Cookies
scooby-cookies:
  enabled: true
  effects:
    resistance:
      duration-ticks: 200
      amplifier: 5

### Excalibur
excalibur:
  enabled: true
  passive-effect:
    enabled: true
    interval-ticks: 20
    strength:
      duration-ticks: 80
      amplifier: 2
  solar-flare:
    enabled: true
    cooldown-ms: 15000
    range: 20.0
    radius: 1.5
    damage: 12.0
    fire-ticks: 100
    blindness-duration: 60
    knockback-horizontal: 1.5
    knockback-vertical: 0.8

### Star Core
star-core:
  enabled: true
  recipe:
    enabled: true

### Ice Crown
ice-crown:
